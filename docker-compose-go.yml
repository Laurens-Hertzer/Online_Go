networks:
  caddy_net:
    external: true

  internal_net_go:
    driver: bridge
    name: internal_net_go


services:

  go_backend:
    build:
      context: https://github.com/Laurens-Hertzer/Online_Go.git#main
      dockerfile: Dockerfile

    container_name: online_go_app
    restart: always

    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 200

    security_opt:
      - no-new-privileges:true

    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - NODE_ENV=${NODE_ENV}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}
      - DB_SSL=${DB_SSL}

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - caddy_net
      - internal_net_go


  postgres:
    image: postgres:16-alpine
    container_name: online_go_db
    restart: always

    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 300

    security_opt:
      - no-new-privileges:true

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - internal_net_go


volumes:

  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/sasha/services/Online_Go/data/postgres